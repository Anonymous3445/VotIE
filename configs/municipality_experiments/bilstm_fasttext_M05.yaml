# bilstm_fasttext — Leave-One-Municipality-Out: M05 as test set
# Generated by scripts/make_lomo_configs.py — do not edit by hand.

model:
  name: bilstm_fasttext
  embedding_dim: 300
  hidden_dim: 128
  num_layers: 1
  dropout: 0.5
  use_crf: true
  use_char_cnn: true
data:
  data_dir: data/citilink-votie-lomo-splits/M05
  train_file: train.jsonl
  dev_file: dev.jsonl
  test_file: test.jsonl
training:
  batch_size: 32
  max_epochs: 20
  learning_rate: 0.0005
  weight_decay: 1e-4
  patience: 2
  device: 0
  apply_bio_validation: true
  seed: 42
embeddings:
  fasttext_path: cc.pt.300.bin
