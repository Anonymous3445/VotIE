# DeBERTa v3 + CRF Configuration
# Municipality Leave-One-Out Experiment: M01 as Test Set
# Train on M02, M03, M04, M05, M06 | Test on M01

model:
  name: "deberta_crf"
  model_name: "microsoft/mdeberta-v3-base"  # DeBERTa v3 base model
  architecture: "crf"
  dropout: 0.1
  num_labels: null  # will be set automatically

data:
  # Municipality split paths
  data_dir: "data/citilink_spans_municipality_splits/M01"
  train_file: "train.jsonl"
  dev_file: "dev.jsonl"
  test_file: "test.jsonl"

training:
  batch_size: 8
  epochs: 10
  learning_rate: 5e-5
  warmup_proportion: 0.1
  weight_decay: 0.01
  patience: 3
  device: 0  # CUDA device ID (e.g., 0, 1, 2) or -1 for CPU
  apply_bio_validation: true  # Apply BIO tag validation during evaluation
  seed: 42  # Random seed for reproducibility

optimization:
  optimizer: "adamw"
  scheduler: "linear_with_warmup"
  grad_clip: 1.0

augmentation:
  max_length: 512
  padding: "max_length"
  truncation: true

windowing:
  enable_windowing: true
  overlap_tokens: 50
